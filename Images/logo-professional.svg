<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="100" cy="100" r="90" fill="url(#logoGradient)" opacity="0.1"/>
  
  <!-- Main icon: Professional hardware tools -->
  <g id="tools" transform="translate(100,100)">
    <!-- Wrench -->
    <g id="wrench-pro">
      <!-- Top jaw -->
      <path d="M -40 -30 Q -50 -30 -55 -25 Q -60 -20 -60 -10 Q -60 -5 -55 0 L -50 5 Q -45 10 -40 10 Q -35 10 -30 5 L -25 0 Q -20 -5 -20 -10 Q -20 -20 -25 -25 Q -30 -30 -40 -30" 
            fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <!-- Handle -->
      <rect x="-20" y="-8" width="50" height="6" rx="3" fill="#ffffff"/>
      <!-- Bottom jaw -->
      <path d="M 30 -10 Q 40 -10 45 -5 Q 50 0 50 10 Q 50 15 45 20 L 40 25 Q 35 30 30 30 Q 25 30 20 25 L 15 20 Q 10 15 10 10 Q 10 0 15 -5 Q 20 -10 30 -10" 
            fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <!-- Screwdriver -->
    <g id="screwdriver-pro">
      <!-- Handle -->
      <rect x="-8" y="-50" width="16" height="25" rx="8" fill="#f97316"/>
      <rect x="-6" y="-48" width="12" height="21" rx="6" fill="#ffffff"/>
      <!-- Shaft -->
      <rect x="-3" y="-25" width="6" height="40" fill="#ffffff"/>
      <!-- Tip -->
      <rect x="-8" y="15" width="16" height="8" rx="2" fill="#ffffff"/>
      <line x1="-8" y1="19" x2="8" y2="19" stroke="#f97316" stroke-width="2"/>
    </g>
    
    <!-- Center bolt -->
    <circle cx="0" cy="0" r="6" fill="#f97316"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>
  
  <!-- Outer decorative ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  
  <!-- Shadow/Glow effect -->
  <use href="#tools" filter="url(#glow)" opacity="0.8"/>
</svg>
