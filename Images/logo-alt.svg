<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern Hardware Logo Design -->
  
  <!-- Background circle (optional) -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#f97316" stroke-width="2" opacity="0.2"/>
  
  <!-- Gear/Wheel icon -->
  <g id="gear">
    <!-- Outer gear teeth -->
    <circle cx="100" cy="100" r="50" fill="none" stroke="#ffffff" stroke-width="3"/>
    
    <!-- Gear teeth (top) -->
    <rect x="95" y="40" width="10" height="15" rx="2" fill="#ffffff"/>
    <rect x="95" y="145" width="10" height="15" rx="2" fill="#ffffff"/>
    
    <!-- Gear teeth (sides) -->
    <rect x="40" y="95" width="15" height="10" rx="2" fill="#ffffff"/>
    <rect x="145" y="95" width="15" height="10" rx="2" fill="#ffffff"/>
    
    <!-- Gear teeth (diagonals) -->
    <rect x="75" y="75" width="10" height="15" rx="2" fill="#ffffff" transform="rotate(-45 100 100)"/>
    <rect x="115" y="115" width="10" height="15" rx="2" fill="#ffffff" transform="rotate(-45 100 100)"/>
    <rect x="115" y="75" width="10" height="15" rx="2" fill="#ffffff" transform="rotate(45 100 100)"/>
    <rect x="75" y="115" width="10" height="15" rx="2" fill="#ffffff" transform="rotate(45 100 100)"/>
    
    <!-- Inner circle -->
    <circle cx="100" cy="100" r="25" fill="none" stroke="#ffffff" stroke-width="3"/>
    
    <!-- Center hub -->
    <circle cx="100" cy="100" r="8" fill="#f97316"/>
  </g>
  
  <!-- Hammer icon (simplified) -->
  <g id="hammer" transform="translate(100,100)">
    <!-- Hammer handle -->
    <rect x="-3" y="20" width="6" height="40" rx="3" fill="#ffffff"/>
    <!-- Hammer head -->
    <rect x="-12" y="15" width="18" height="12" rx="2" fill="#ffffff"/>
    <!-- Hammer claw -->
    <path d="M -12 15 L -18 10 L -18 5 L -12 10 Z" fill="#ffffff"/>
  </g>
  
  <!-- Shadow effects -->
  <defs>
    <filter id="shadow-alt">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Apply shadow -->
  <use href="#gear" filter="url(#shadow-alt)"/>
  <use href="#hammer" filter="url(#shadow-alt)"/>
</svg>
